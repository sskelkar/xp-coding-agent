name: tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --frozen
      - run: docker build -f Dockerfile.tests -t xp-agent-tests:0.1 .
      - run: uv run pytest
        env:
          XP_DOCKER_TESTS: '1'
